<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Tịnh Độ An Trú — bộ icon riêng (design system v2, "thanh mảnh")
    Lưới 24 × 24, nét 1.25, đầu nét và góc nối tròn, không tô nền, màu theo chữ (currentColor).
    Dùng: <svg class="td-icon" aria-hidden="true"><use href="design-system/icons.svg#i-lotus"/></svg>
    Icon mới: vẽ cùng lưới 24px, nét 1.25, không góc nhọn; thêm vào đây và vào bảng trong DESIGN.md.

    Nguồn: hình vẽ từ artifact Design System v1 (nét 1.5, đã hạ xuống 1.25);
    lotus, listen, sutra, clock, close và episodes lấy đúng nét đang chạy trên site
    (TabBar trong index.html, bảng danh sách tập trong xem-bai-giang.html).
  -->

